name: Deploy VACUNA60

on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-vacuna60.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare app
        run: |
          mkdir -p public
          curl -L --fail https://raw.githubusercontent.com/Peter24a/ApuntesClase/main/VACUNA60/index.html -o public/index.html
      - name: Deploy
        id: deploy
        uses: shipstatic/action@v2
        with:
          path: ./public
      - name: URL
        run: echo "PUBLIC_URL=${{ steps.deploy.outputs.url }}"

# Trigger deployment
